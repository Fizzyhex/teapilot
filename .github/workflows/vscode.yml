name: VS Code extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm ci --prefix extensions/vscode
      - run: npm run check
      - run: npm run typecheck --prefix extensions/vscode
      - run: npm run package --prefix extensions/vscode
      - name: Extension integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test --prefix extensions/vscode
      - name: Extension integration (Windows)
        if: runner.os == 'Windows'
        run: npm test --prefix extensions/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: teapilot-vsix-${{ runner.os }}
          path: extensions/vscode/teapilot.vsix
          if-no-files-found: error
