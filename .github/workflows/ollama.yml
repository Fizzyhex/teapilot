name: real Ollama validation
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        model: ['qwen3.5:4b', 'qwen3.5:2b']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Ollama on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          sh "$RUNNER_TEMP/ollama-install.sh"
          sudo systemctl start ollama
      - name: Install and start Ollama on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ollama.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'ollama'
          Invoke-WebRequest https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $runtime | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Start-Process -FilePath (Join-Path $runtime 'ollama.exe') -ArgumentList 'serve' -WindowStyle Hidden
      - name: Wait for the local runtime
        shell: pwsh
        run: |
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try { Invoke-RestMethod http://127.0.0.1:11434/api/version; exit 0 } catch { Start-Sleep -Seconds 1 }
          }
          throw 'Ollama did not start'
      - name: Validate the guided model preset
        env:
          TEAPILOT_TEST_MODEL: ${{ matrix.model }}
        run: npm run test:ollama
